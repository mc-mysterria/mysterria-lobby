plugins {
    id 'java'
    id("com.gradleup.shadow") version "9.4.1"
    id("xyz.jpenilla.run-paper") version "3.0.2"
}

group = 'net.mysterria'
version = '1.1.0'
description = 'MysterriaLobby'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://repo.panda-lang.org/releases" }

    maven {
        url "https://repo.triumphteam.dev/snapshots/"
    }

    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }

    maven {
        url = 'https://nexus.mysterria.net/repository/plugin-public/'
        content {
            includeGroup('dev.ua.ikeepcalm')
            includeGroup('dev.ua.ikeepcalm.mysterria')
        }
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.1.2.build.+")
    implementation 'dev.ua.ikeepcalm.mysterria:audit-client:1.0.0-SNAPSHOT'
    implementation("net.kyori:adventure-text-minimessage:5.0.0")
    implementation("dev.triumphteam:triumph-gui-paper:3.1.13")
    implementation("dev.rollczi:litecommands-bukkit:3.10.9")
}

processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(project.properties)
    }
}

shadowJar {
    archiveClassifier = ''
    relocate 'dev.ua.ikeepcalm.mysterria.audit', 'net.mysterria.lobby.libs.audit'
}

build {
    dependsOn shadowJar
}
